# Compute plane (spec §1): Monte Carlo, model fitting and ingestion run HERE,
# never inside a Vercel or Supabase Edge Function.
#
# Known GitHub Actions quirks (spec §8):
#  - cron is best-effort and can fire 15-60 min late at peak: schedules run
#    earlier than the moment fresh data is needed.
#  - scheduled workflows are disabled after 60 days without repo activity:
#    push a trivial commit or re-enable in the Actions tab before kickoff.
name: refresh

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6h, year-round (also keeps Supabase from auto-pausing)
    - cron: "0 * * 6,7 *"   # hourly during June-July (the 2026 tournament window)
  workflow_dispatch: {}      # manual trigger for the first populate + debugging

concurrency:
  group: engine-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r engine/requirements.txt

      - name: Run engine (ingest -> elo -> model -> simulate -> upsert)
        run: python -m engine.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          STATSAPI_KEY: ${{ secrets.STATSAPI_KEY }}   # Pipeline B; engine runs A-only when absent
          ELO_GOAL_BETA: *{{ 0.0022 }}
