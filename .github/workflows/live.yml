# Live stats polling (spec v4 §5.5) — Pipeline B matchday loop.
# Cheap by design: the script self-exits when no fixture is live or imminent,
# so off-window runs cost a few seconds of Actions time and zero API calls.
name: live

on:
  schedule:
    - cron: "*/5 * * 6,7 *"   # every 5 min during June-July (tournament window)
  workflow_dispatch: {}

concurrency:
  group: live-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r engine/requirements.txt

      - name: Poll live fixtures (self-exits if none)
        run: python -m engine.live_statsapi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATSAPI_KEY: ${{ secrets.STATSAPI_KEY }}
